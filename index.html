<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0" defer></script>
    <script src="script.js" defer></script>
    <title>Monitor Solar</title>

</head>
<body>
  <header>
    <h1>Monitor Solar</h1>
    <p id="data">08/11/2026</p>
  </header>

  <main>
    <section class="cartao resumo">
      <div class="metrica">
        <p class="rotulo">Energia gerada</p>
        <p class="valor"><span id="energia">391</span> Wh</p>
      </div>
      <div class="metrica">
        <p class="rotulo">Potência de pico</p>
        <p class="valor"><span id="pico">57</span> W</p>
      </div>
      <div class="metrica">
        <p class="rotulo">Tensão máxima</p>
        <p class="valor"><span id="tensao">20</span> V</p>
      </div>
    </section>

    <section class="cartao">
      <h2>Gráfico do dia</h2>
      <canvas id="grafico"></canvas>
    </section>
  </main>
</body>
</html>
